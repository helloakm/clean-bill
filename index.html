<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Bill — Premium Invoicing</title>
</head>
<body>

<div id="clean-bill-app" class="cb-wrapper">

  <!-- 1. TOP BAR -->
  <div class="cb-grid-container cb-top-bar">
    <div class="cb-brand-zone">
      <span class="cb-brand">CLEAN BILL</span>
      <span class="cb-period-tag" id="cb-period-label">Смета 2025</span>
    </div>
    <button id="download-xls-btn" class="cb-excel-btn" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      <span>Скачать Excel</span>
    </button>
  </div>

  <!-- 2. HERO SECTION -->
  <div class="cb-grid-container">
    <p class="cb-intro-text" id="cb-summary-text"></p>

    <div class="cb-hero">
      <span id="cb-hero-hours" class="cb-hero-number">0</span>
      <span class="cb-hero-label">рабочих часов</span>
    </div>

    <div class="cb-finance-line" id="invoice-trigger">
      <span class="cb-fin-item">Выполнено на сумму: <strong id="cb-earned">0 ₽</strong></span>
      <span class="cb-sep">|</span>
      <span class="cb-fin-item">Авансы: <strong id="cb-paid">0 ₽</strong></span>
      <span class="cb-sep">|</span>
      <span class="cb-fin-item">К оплате: <strong id="cb-balance">0 ₽</strong></span>
    </div>

    <!-- 3. NAVIGATION & SWITCHER -->
    <div class="cb-nav-row" id="cb-sticky-nav">
      <div class="cb-switcher">
        <button class="cb-sw-btn active" data-filter="all" type="button">Все проекты</button>
        <button class="cb-sw-btn" data-filter="dev" type="button">Разработка</button>
        <button class="cb-sw-btn" data-filter="comm" type="button">Правки</button>
      </div>
      <div class="cb-arrows-desktop">
        <button class="cb-arrow" id="slide-prev-btn" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <button class="cb-arrow" id="slide-next-btn" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 4. PROJECT CARDS CAROUSEL -->
  <div class="cb-carousel-viewport">
    <div class="cb-carousel-track" id="cb-cards-grid"></div>
  </div>

  <!-- 5. CALENDAR SECTION -->
  <div class="cb-grid-container">
    <div class="cb-cal-header-wrap" id="calendar-anchor">
      <button class="cb-cal-btn" id="cal-prev-btn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <div id="cb-month-label">Декабрь 2025</div>
      <button class="cb-cal-btn" id="cal-next-btn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <div class="cb-calendar-container" id="cb-scroll-box">
    <div class="cb-calendar-grid" id="cb-calendar-grid"></div>
  </div>
</div>

<!-- EXTERNAL LIBRARIES -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
/* =========================
   1) DATA SOURCE (Demo Data)
   ========================= */
const icsData = String.raw`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Clean Bill//Demo//EN
BEGIN:VEVENT
SUMMARY:Айдентика бренда, разработка
DTSTART:20251201T100000Z
DTEND:20251201T140000Z
END:VEVENT
BEGIN:VEVENT
SUMMARY:Прототип сайта, разработка
DTSTART:20251203T090000Z
DTEND:20251203T170000Z
END:VEVENT
BEGIN:VEVENT
SUMMARY:Набор иконок, разработка
DTSTART:20251204T130000Z
DTEND:20251204T160000Z
END:VEVENT
BEGIN:VEVENT
SUMMARY:Лендинг, правки
DTSTART:20251208T110000Z
DTEND:20251208T133000Z
END:VEVENT
BEGIN:VEVENT
SUMMARY:Презентация продукта, комментарии
DTSTART:20251210T140000Z
DTEND:20251210T153000Z
END:VEVENT
BEGIN:VEVENT
SUMMARY:Каталог продукции, корректировки
DTSTART:20251212T100000Z
DTEND:20251212T120000Z
END:VEVENT
BEGIN:VEVENT
SUMMARY:Аванс 15000
DTSTART:20251201T080000Z
DTEND:20251201T083000Z
END:VEVENT
END:VCALENDAR`;

/* =========================
   2) CONFIGURATION
   ========================= */
const tgUsername = 'helloakm';
const hourlyRate = 5000;
const currencySymbol = '₽';
const startHour = 7;
const endHour = 23;

/* =========================
   3) APP LOGIC
   ========================= */
let globalProjects = {};
let globalFinance = { earned: 0, paid: 0, balance: 0, totalH: 0, devH: 0, commH: 0 };
let eventsByDate = new Map();

function esc(s) { return String(s).replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[m])); }
function easeOutQuart(x) { return 1 - Math.pow(1 - x, 4); }

function animate(id, end, dur, suffix = "") {
  const el = document.getElementById(id); if(!el) return;
  const startT = performance.now();
  function step(now) {
    const progress = Math.min((now - startT) / dur, 1);
    const val = (easeOutQuart(progress) * end);
    el.innerText = Math.floor(val).toLocaleString('ru-RU') + suffix;
    if (progress < 1) requestAnimationFrame(step);
    else if (id === 'cb-balance' && end > 0 && typeof confetti === 'function') {
      const r = document.getElementById('cb-hero-hours').getBoundingClientRect();
      confetti({ particleCount: 140, spread: 70, origin: { x: (r.left + r.width/2)/window.innerWidth, y: (r.top + r.height/2)/window.innerHeight } });
    }
  }
  requestAnimationFrame(step);
}

function openTg(projName, category, hours, cost, dates) {
  const typeLabel = category === 'comm' ? 'Правки' : 'Разработка';
  const message = `Уточни детали по задаче\n${projName} / ${typeLabel} / ${dates} / ${hours} ч / ${cost.toLocaleString('ru-RU')} ${currencySymbol}`;
  window.open(`https://t.me/${tgUsername}?text=${encodeURIComponent(message)}`, '_blank');
}

function scrollToDate(dateStr, projectKey) {
  const target = document.querySelector(`[data-full-date="${dateStr}"]`);
  if (!target) return;
  document.getElementById('calendar-anchor').scrollIntoView({ behavior: 'smooth', block: 'start' });
  setTimeout(() => {
    const box = document.getElementById('cb-scroll-box');
    const scrollTarget = target.offsetLeft - (box.clientWidth / 2) + (target.clientWidth / 2);
    box.scrollTo({ left: scrollTarget, behavior: 'smooth' });
    const block = target.querySelector(`[data-project-key="${projectKey}"]`);
    if (block) {
      block.classList.add('cell-active-highlight');
      setTimeout(() => block.classList.remove('cell-active-highlight'), 3500);
    }
  }, 450);
}

document.addEventListener("DOMContentLoaded", () => {
  if (typeof ICAL === 'undefined') return;
  if (!icsData || icsData.length < 50) return;

  try {
    const jcalData = ICAL.parse(icsData.trim());
    const comp = new ICAL.Component(jcalData);
    const vevents = comp.getAllSubcomponents('vevent');
    let firstD = null, lastD = null;

    vevents.forEach(v => {
      const ev = new ICAL.Event(v);
      if (ev.startDate && ev.startDate.isDate) return;

      let title = (ev.summary || "").replace(/\\,/g, ',').trim();
      const start = ev.startDate.toJSDate();
      const end = ev.endDate.toJSDate();
      if (end - start <= 0) return;

      if (title.toLowerCase().match(/оплат|аванс/)) {
        const amount = parseFloat(title.replace(/[^\d.]/g, ''));
        if (!isNaN(amount)) globalFinance.paid += amount;
      } else {
        const isComm = !!title.toLowerCase().match(/правк|коммент|комент|коррект|финализ|финиш|final|готово/);
        const cat = isComm ? 'comm' : 'dev';
        const hrs = Math.ceil(((end - start) / 3600000) * 2) / 2;
        const name = title.split(',')[0].trim() || title.trim();
        const key = name.replace(/\s+/g, '_').toLowerCase() + "_" + cat;
        
        if (!globalProjects[key]) {
          globalProjects[key] = { name, category: cat, time: 0, dates: new Map(), id: key };
        }
        globalProjects[key].time += hrs;
        const shortTag = start.toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit' });
        globalProjects[key].dates.set(shortTag, start.toDateString());
        
        if (cat === 'dev') globalFinance.devH += hrs; else globalFinance.commH += hrs;
        const ds = start.toDateString();
        if (!eventsByDate.has(ds)) eventsByDate.set(ds, []);
        eventsByDate.get(ds).push({ title: esc(title), start, end, category: cat, projectKey: key });

        if (!firstD || start < firstD) firstD = new Date(start);
        if (!lastD || start > lastD) lastD = new Date(start);
      }
    });

    globalFinance.totalH = globalFinance.devH + globalFinance.commH;
    globalFinance.earned = globalFinance.totalH * hourlyRate;
    globalFinance.balance = globalFinance.earned - globalFinance.paid;

    if (lastD) {
      document.getElementById('cb-period-label').innerText = `Смета за ${lastD.toLocaleString('ru-RU', { month:'long', year:'numeric' })}`;
      document.getElementById('cb-summary-text').innerText = `С ${firstD.getDate()} ${firstD.toLocaleString('ru-RU',{month:'short'})} по ${lastD.getDate()} ${lastD.toLocaleString('ru-RU',{month:'short'})} затрачено: разработка ${globalFinance.devH} ч., правки — ${globalFinance.commH} ч.`;
    }

    const renderCards = (filter) => {
      const track = document.getElementById('cb-cards-grid'); track.innerHTML = '';
      Object.keys(globalProjects).sort().forEach(k => {
        const p = globalProjects[k]; if (filter !== 'all' && p.category !== filter) return;
        const cost = p.time * hourlyRate;
        const label = p.category === 'comm' ? 'Правки' : 'Разработка';
        let dTags = ''; const dList = [];
        p.dates.forEach((fd, l) => { 
            dTags += `<span class="date-tag" onclick="scrollToDate('${fd}','${p.id}')">${l}</span>`; dList.push(l);
        });

        track.innerHTML += `
          <div class="cb-card ${p.category==='comm'?'card-comm':'card-dev'}">
            <div class="cb-card-title">${esc(p.name)}</div>
            <div class="cb-card-row">
                <span class="cb-type-label"><span class="cb-dot"></span>${label}</span>
                <span>${p.time.toFixed(1)} ч</span>
            </div>
            <div class="cb-card-details-reveal">
                <div class="cb-card-dates">${dTags}</div>
                <div class="cb-tg-link" onclick="openTg('${esc(p.name)}', '${p.category}', ${p.time.toFixed(1)}, ${cost}, '${dList.join(', ')}')">Уточнить в Телеграм</div>
            </div>
            <div class="cb-card-total"><span>Итого</span><span>${cost.toLocaleString('ru-RU')} ${currencySymbol}</span></div>
          </div>`;
      });
    };
    renderCards('all');

    document.querySelectorAll('.cb-sw-btn').forEach(btn => {
      btn.onclick = (e) => {
        document.querySelectorAll('.cb-sw-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active'); renderCards(e.target.dataset.filter);
      };
    });

    document.getElementById('slide-next-btn').onclick = () => document.getElementById('cb-cards-grid').scrollBy({left: 410, behavior:'smooth'});
    document.getElementById('slide-prev-btn').onclick = () => document.getElementById('cb-cards-grid').scrollBy({left: -410, behavior:'smooth'});

    const obs = new IntersectionObserver(e => {
      if (e[0].isIntersecting) {
        animate('cb-hero-hours', globalFinance.totalH, 1500);
        animate('cb-earned', globalFinance.earned, 1200, ` ${currencySymbol}`);
        animate('cb-paid', globalFinance.paid, 1200, ` ${currencySymbol}`);
        animate('cb-balance', globalFinance.balance, 1500, ` ${currencySymbol}`);
        obs.unobserve(e[0].target);
      }
    }, { threshold: 0.1 });
    obs.observe(document.getElementById('invoice-trigger'));

    renderCalendar(firstD, lastD);

    document.getElementById('download-xls-btn').onclick = function() {
      const data = [["CLEAN BILL — Смета 2025"], ["Тип", "Проект", "Время (ч)", "Сумма"], []];
      Object.values(globalProjects).forEach(p => {
        data.push([p.category === 'dev' ? 'Разработка' : 'Правки', p.name, p.time, p.time * hourlyRate]);
      });
      data.push([], ["ИТОГО К ОПЛАТЕ", "", "", `${globalFinance.balance.toLocaleString('ru-RU')} ${currencySymbol}`]);
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data), "Смета");
      XLSX.writeFile(wb, "Smeta_CleanBill.xlsx");
    };
  } catch(e) { console.error(e); }

  function renderCalendar(start, end) {
    const grid = document.getElementById('cb-calendar-grid'), scrollBox = document.getElementById('cb-scroll-box'), monthLabel = document.getElementById('cb-month-label');
    let html = '<div class="cb-time-sidebar">'; for (let i=startHour; i<endHour; i++) html += `<div class="cb-time-label">${i}:00</div>`; html += '</div>';
    let loop = new Date(start); loop.setHours(0,0,0,0); loop.setDate(loop.getDate()-2);
    let stop = new Date(end); stop.setHours(0,0,0,0); stop.setDate(stop.getDate()+1);
    while (loop <= stop) {
        const ds = loop.toDateString();
        html += `<div class="cb-day-column" data-full-date="${ds}" ${loop.getDate()===1?`data-month-start="${loop.getMonth()}-${loop.getFullYear()}"`:''}>
            <div class="cb-day-header"><div class="cb-day-name">${loop.toLocaleString('ru-RU',{weekday:'short'})} ${loop.toLocaleString('ru-RU',{month:'short'})}</div><div class="cb-day-num">${loop.getDate()}</div></div>
            <div class="cb-day-body">`;
        (eventsByDate.get(ds) || []).forEach(ev => {
            const top = (ev.start.getHours()-startHour)*60+ev.start.getMinutes();
            const h = ((ev.end-ev.start)/3600000)*60;
            const bgO = ev.start.getMinutes() === 0 ? 0 : (60 - ev.start.getMinutes());
            html += `<div class="cb-event-block ${ev.category==='comm'?'cb-event-comm':'cb-event-dev'}" data-project-key="${ev.projectKey}" style="top:${top}px; height:${h}px; background-position-y:${bgO}px;"><div class="cb-event-info">${ev.title}</div></div>`;
        });
        if (ds === stop.toDateString()) html += `<div class="cb-easter-egg-box"><div class="cb-easter-egg">The Show Must Go On</div></div>`;
        html += `</div></div>`; loop.setDate(loop.getDate()+1);
    }
    grid.innerHTML = html;
    const offsets = [];
    setTimeout(() => {
        document.querySelectorAll('#clean-bill-app [data-month-start]').forEach(el => {
            const [m,y] = el.getAttribute('data-month-start').split('-');
            offsets.push({ offset: el.offsetLeft - 60, name: new Date(y,m,1).toLocaleString('ru-RU',{month:'long',year:'numeric'})});
        });
        scrollBox.scrollLeft = scrollBox.scrollWidth;
    }, 400);
    scrollBox.addEventListener('scroll', () => {
        const sL = scrollBox.scrollLeft + (window.innerWidth/3);
        let active = offsets[0]; offsets.forEach(m => { if(sL >= m.offset) active = m; });
        if (active) monthLabel.innerText = active.name;
    }, { passive: true });
    document.getElementById('cal-next-btn').onclick = () => scrollBox.scrollBy({ left: 186*7, behavior:'smooth'});
    document.getElementById('cal-prev-btn').onclick = () => scrollBox.scrollBy({ left: -186*7, behavior:'smooth'});
  }
});
</script>

<style>

   CLEAN BILL — GOLD STANDARD UI
   ========================= */

    --text-main: #000; --text-secondary: #86868b; --cb-red: #ff3b30;
}

#clean-bill-app .cb-finance-line { font-size: 20px; margin-bottom: 100px; display: flex; align-items: center; }

/* Switcher & Nav */
#clean-bill-app .cb-nav-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: #fff; }

@media (min-width: 1025px) {
    #clean-bill-app .cb-carousel-track:hover .cb-card { opacity: 0.4; background: #f5f5f7; border-color: transparent; }
    #clean-bill-app .cb-card:hover { background: #fff !important; box-shadow: 0 20px 50px rgba(0,0,0,0.05); transform: translateY(-5px); border: 1px solid var(--cb-line); }
    #clean-bill-app .cb-card-details-reveal { opacity: 0; max-height: 0; transition: all 0.3s; overflow: hidden; }
    #clean-bill-app .cb-card:hover .cb-card-details-reveal { opacity: 1; max-height: 300px; margin-bottom: 20px; }
}

/* Calendar Grid */
#clean-bill-app .cb-cal-header-wrap { display: flex; justify-content: flex-start; align-items: center; padding-bottom: 30px; }
#clean-bill-app #cb-month-label { font-size: 20px; font-weight: 700; text-transform: capitalize; color: #000; margin: 0 20px; }
#clean-bill-app .cb-cal-btn { background: none; border: none; cursor: pointer; color: #ccc; padding: 8px; display: flex; align-items: center; transition: 0.2s; }
#clean-bill-app .cb-cal-btn:hover { color: #000; }
